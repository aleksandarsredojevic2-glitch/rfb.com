<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>RFB | Real Football Battle</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden !important;
    position: fixed;
    touch-action: none; /* Sprečava zoom i scroll na mobilnom */
}

canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
#game-ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none; /* Da klikovi prolaze kroz UI do canvasa ako treba */
}

/* Osiguraj da svi ekrani budu preko celog ekrana */
#screen-login, #screen-rooms, #screen-lobby {
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto; /* Da klikovi rade na dugmićima */
}
#screen-lobby {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding-top: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: url('slikazalobby.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}
/* Definiše stubove (kolone) za timove */
.team-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 180px;
}

.team-column button {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
}

.team-column ul {
    list-style-type: none;
    padding: 0 !important;
    margin: 0;
    width: 100%;
    text-align: center;
}

.team-column li {
    width: 100%;
    padding: 5px 0;
    color: black;
    font-family: sans-serif;
    font-weight: bold;
}
#screen-rooms {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 40px;
    gap: 20px;

    background-image: url('room.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: 5;
}
#room-list-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 60vh;
    overflow-y: auto;
    width: 340px;
}
.room-entry {
    background: rgba(255,255,255,0.85);
    padding: 10px 14px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: sans-serif;
    font-weight: bold;
    color: #1a1a1a;
}
.room-entry button {
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 4px;
    border: none;
    background: #4d94ff;
    color: white;
    font-weight: bold;
}
#chatInputContainer {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 101;
    width: 590px;
}

#chatInput {
    width: 100%;
    padding: 1px;
    border-radius: 3px;
    border: none;
    outline: none;
    background: #9EACB880;
    color: #353B39;
    box-sizing: border-box;
}
.admin-move-btn {
    margin-left: 6px;
    padding: 1px 6px;
    font-size: 11px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.12);
    color: white;
    cursor: pointer;
}
.admin-move-btn:hover {
    background: rgba(255,255,255,0.28);
}
/* --- IN-GAME TOP BAR (menu + settings) --- */
#gameTopBar {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 200;
    display: none;
    gap: 8px;
    pointer-events: auto;
}
.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(20, 24, 30, 0.75);
    color: white;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
}
.icon-btn:hover {
    background: rgba(40, 46, 56, 0.9);
}
.game-panel {
    position: absolute;
    top: 58px;
    right: 12px;
    z-index: 200;
    display: none;
    background: rgba(20, 24, 30, 0.9);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 14px;
    color: white;
    font-family: sans-serif;
    min-width: 220px;
    pointer-events: auto;
}
.game-panel h3 {
    margin-bottom: 10px;
    font-size: 15px;
    text-align: center;
    letter-spacing: 1px;
    color: #cfd8e3;
}
#gameMenuPanel .menu-team-columns {
    display: flex;
    gap: 16px;
    justify-content: space-between;
}
#gameMenuPanel .menu-team-columns > div {
    flex: 1;
    text-align: center;
}
#gameMenuPanel .menu-team-columns h4 {
    font-size: 12px;
    margin-bottom: 6px;
    font-weight: bold;
}
#gameMenuPanel .menu-team-columns h4.red { color: #FF4A4A; }
#gameMenuPanel .menu-team-columns h4.blue { color: #4d94ff; }
#gameMenuPanel .menu-team-columns h4.spec { color: #A6A6A6; }
#gameMenuPanel ul {
    list-style: none;
    font-size: 13px;
}
#gameMenuPanel ul li {
    padding: 2px 0;
}
#gameSettingsPanel .zoom-options {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
#gameSettingsPanel .zoom-options button {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: white;
    cursor: pointer;
    font-size: 13px;
}
#gameSettingsPanel .zoom-options button:hover {
    background: rgba(255,255,255,0.18);
}
#gameSettingsPanel .zoom-options button.active {
    background: #4d94ff;
    border-color: #4d94ff;
    font-weight: bold;
}
#gameControlsPanel .controls-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
#gameControlsPanel .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    gap: 16px;
}
#gameControlsPanel .controls-key {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 5px;
    padding: 4px 10px;
    font-weight: bold;
    white-space: nowrap;
}
#goal-limit-selector {
    margin-top: 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
#goal-limit-selector span {
    color: white;
    font-weight: bold;
    font-family: sans-serif;
}
.limit-btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: white;
    cursor: pointer;
    font-weight: bold;
}
.limit-btn:hover {
    background: rgba(255,255,255,0.22);
}
.limit-btn.active {
    background: #4d94ff;
    border-color: #4d94ff;
}
#goalBanner {
    display: none;
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 62px;
    font-weight: 900;
    font-family: Arial, sans-serif;
    text-shadow: 3px 3px 0 black, -2px -2px 0 black, 2px -2px 0 black, -2px 2px 0 black;
    z-index: 9998;
    pointer-events: none;
    letter-spacing: 2px;
    text-align: center;
}
#screen-login {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    display: flex;
    flex-direction: row;
    justify-content: center;

    padding-top: 70vh;
    align-items: flex-start;

    background-image: url('lobby.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    gap: 2px;
}
    </style>
</head>
<body>
    <div id="game-ui">
        <div id="screen-login">
            <input type="text" id="nameInput" placeholder="Enter a nickname...">
            <button onclick="goToRoomScreen()">Continue</button>
        </div>

        <div id="screen-rooms" style="display: none;">
            <h2 style="color: black;">Room list</h2>
            <button onclick="createNewRoom()">Create new room</button>
            <div id="room-list-container"></div>
        </div>

         <div id="screen-lobby" style="display: none;">

            <h1 style="color: white; margin-bottom: 30px;"></h1>

            <div style="display: flex; gap: 20px; justify-content: center;">

                <!-- RED -->
                <div class="team-column">
                    <button onclick="changeTeam('red')">RED</button>
                    <ul id="list-red"></ul>
                </div>

                <!-- SPECTATE -->
                <div class="team-column">
                    <button onclick="changeTeam('spectator')">SPECTATE</button>
                    <ul id="list-spectators"></ul>
                </div>

                <!-- BLUE -->
                <div class="team-column">
                    <button onclick="changeTeam('blue')">BLUE</button>
                    <ul id="list-blue"></ul>
                </div>
            </div>

            <div id="goal-limit-selector">
                <span>Broj golova za pobedu:</span>
                <div style="display: flex; gap: 6px;">
                    <button class="limit-btn" data-limit="1" onclick="setGoalLimit(1)">1</button>
                    <button class="limit-btn" data-limit="2" onclick="setGoalLimit(2)">2</button>
                    <button class="limit-btn" data-limit="3" onclick="setGoalLimit(3)">3</button>
                    <button class="limit-btn" data-limit="4" onclick="setGoalLimit(4)">4</button>
                    <button class="limit-btn active" data-limit="5" onclick="setGoalLimit(5)">5</button>
                </div>
            </div>

            <button id="start-btn" onclick="sendStart()" style="margin-top: 20px; display: none;">START GAME</button>

        </div>
    </div>
    <canvas id="hockeyCanvas"></canvas>

    <div id="gameTopBar">
        <div class="icon-btn" id="menuBtn" onclick="toggleMenuPanel()" title="Menu">☰</div>
        <div class="icon-btn" id="settingsBtn" onclick="toggleSettingsPanel()" title="Settings">⚙</div>
        <div class="icon-btn" id="controlsBtn" onclick="toggleControlsPanel()" title="Controls">ℹ️</div>
        <div class="icon-btn" id="stopGameBtn" onclick="confirmStopGame()" title="Prekini igru" style="display: none;">⛔</div>
    </div>

    <div id="gameMenuPanel" class="game-panel">
        <h3>PLAYERS</h3>
        <div class="menu-team-columns">
            <div>
                <h4 class="red">RED</h4>
                <ul id="menu-list-red"></ul>
            </div>
            <div>
                <h4 class="spec">SPEC</h4>
                <ul id="menu-list-spectators"></ul>
            </div>
            <div>
                <h4 class="blue">BLUE</h4>
                <ul id="menu-list-blue"></ul>
            </div>
        </div>
    </div>

    <div id="gameSettingsPanel" class="game-panel">
        <h3>CAMERA ZOOM</h3>
        <div class="zoom-options" id="zoomOptions">
            <button data-zoom="1" onclick="setCameraZoom(1)">x1</button>
            <button data-zoom="1.25" onclick="setCameraZoom(1.25)">x1.25</button>
            <button data-zoom="1.5" onclick="setCameraZoom(1.5)">x1.5</button>
            <button data-zoom="1.75" onclick="setCameraZoom(1.75)">x1.75</button>
            <button data-zoom="2" onclick="setCameraZoom(2)">x2</button>
        </div>
    </div>

    <div id="gameControlsPanel" class="game-panel">
        <h3>CONTROLS</h3>
        <div class="controls-list">
            <div class="controls-row"><span class="controls-key">WASD / Arrows</span><span>Move</span></div>
            <div class="controls-row"><span class="controls-key">Space / X</span><span>Pass</span></div>
            <div class="controls-row"><span class="controls-key">Z</span><span>Shoot</span></div>
        </div>
    </div>

    <div id="goalBanner"></div>

<div id="chatBox" style="
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 100px;
    background: #9EACB860;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: black;
    overflow-y: auto;
    padding: 10px;
    border-radius: 12px;
    display: none;
    z-index: 9999;
    font-size: 14px;
    font-family: sans-serif;">
</div>
<div id="chatInputContainer" style="display: none;">
    <input type="text" id="chatInput" placeholder="Press Enter for chat...">
</div>
<script src="game.js"></script>
</body>
</html>
